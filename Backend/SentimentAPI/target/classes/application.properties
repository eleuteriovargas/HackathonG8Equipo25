spring.application.name=SentimentAPI
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/sentiment_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sentiment}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:sentiment}


spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#==============
# JPA
#==============
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate

#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true

#=============
# Flyway
#=============
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Guardar por lotes
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true


# Data Science Service
ds.base-url=http://sentiment-model:8000


# Logs
logging.level.root=INFO
logging.level.com.alura=DEBUG
