services:
  mysql:
    image: mysql:8.0
    container_name: sentiment-mysql
    restart: always
    environment:
      MYSQL_DATABASE: sentiment_db
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: sentiment
      MYSQL_PASSWORD: sentiment
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "sentiment", "-psentiment"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: sentiment-backend
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/sentiment_db?allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: sentiment
      SPRING_DATASOURCE_PASSWORD: sentiment
      SPRING_JPA_HIBERNATE_DDL_AUTO: update

volumes:
  mysql_data:
